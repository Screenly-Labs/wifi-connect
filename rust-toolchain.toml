[toolchain]
channel = "1.99"
components = ["rustfmt", "clippy"]
# The three release targets. Static musl everywhere: the runtime image is
# FROM scratch, and a glibc binary there would need a loader, libc.so.6 and
# version-matched symbols.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
]
