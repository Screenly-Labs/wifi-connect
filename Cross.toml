# Cross-compilation for the three release targets.
#
# `cross` is chosen over cargo-zigbuild and over native runners for one
# specific reason: `cross test --target armv7-unknown-linux-musleabihf` runs
# the test binary under qemu-user. This crate contains hand-written DHCP and
# DNS wire codecs, and an alignment or byte-order bug there is invisible on
# x86_64 and fatal on armv7. There is also no hosted armv7 GitHub runner, so
# a native-runner strategy would need a second mechanism anyway.
#
# The images are pinned to the 0.2.5 release tag AND to that tag's
# manifest digest. A tag is a mutable pointer in someone else's registry;
# these images compile and link the release binaries, so whoever can move
# the tag would otherwise choose what ships. With `tag@digest`, Docker pulls
# by digest and the tag is only there for humans to read. Bumping an image
# means updating both, e.g. from
# `docker buildx imagetools inspect ghcr.io/cross-rs/<target>:<tag>`
# (the top-level index digest, not a per-platform one).
#
# Note that `cross` has developed on `main` since 2023; if a target image
# misbehaves, pin a `main` commit SHA rather than floating.

[build]
default-target = "x86_64-unknown-linux-musl"

[build.env]
passthrough = ["RUSTFLAGS", "CARGO_TERM_COLOR", "RUST_LOG"]

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:0.2.5@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4"

[target.armv7-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-musleabihf:0.2.5@sha256:b4f481f30ceca34730a5723f717396d762d94f6eddd7e1cf7c7862d1377ff98c"

# ARMv6 hard-float: Raspberry Pi 1 and Pi Zero. The bare `arm-` triple is
# the ARMv6 baseline; `armv7-` above is a different, newer target.
[target.arm-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/arm-unknown-linux-musleabihf:0.2.5@sha256:283b8271593b7f2504d8b84f6f01e0a3e005802b784d90f357e1ce283a7554f9"
