name: release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it uses.
#
# These used to be granted here, at workflow level, which handed a
# release-writing, package-pushing, OIDC-minting token to every job --
# including the build matrix, which runs `bun install`, executes
# third-party `cross` containers and compiles a few hundred crates' build
# scripts. None of that needs to write anything to GitHub, so none of it
# gets a token that can.
#
# Same-run artifacts do NOT need `actions: read`: upload-/download-artifact
# talk to the artifact service with the runner's own ACTIONS_RUNTIME_TOKEN,
# not GITHUB_TOKEN. (That permission is only for pulling artifacts out of a
# different run via `github-token:`, which nothing here does.)
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before anything is built or pushed. A tag that disagrees with
  # Cargo.toml produces tarballs named for one version containing a
  # binary that reports another, and container tags derived from a
  # version the code has never heard of -- all of it published and
  # immutable by the time anyone notices.
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sh packaging/version.sh)"
          if [ "${tag}" != "${crate}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml" \
                 "version ${crate}. Bump Cargo.toml (and Cargo.lock) or" \
                 "retag."
            exit 1
          fi
          echo "releasing ${crate}"

  build:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
            platform: linux/arm64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            platform: linux/arm/v7
          # ARMv6: Raspberry Pi 1 and Pi Zero. The bare `arm-` triple is
          # the ARMv6 baseline, not a typo for `armv7-`.
          - target: arm-unknown-linux-musleabihf
            arch: armv6
            platform: linux/arm/v6
    runs-on: ubuntu-24.04
    # Read-only: this is the job that runs other people's code (npm
    # packages, cross images, crate build scripts).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
          # setup-bun otherwise restores the bun executable itself from the
          # Actions cache, and that executable then runs in this job before
          # `cross build`. Same reasoning as the missing rust-cache below.
          no-cache: true
      # Rebuilt rather than trusted: a release must not ship whatever
      # happened to be committed in ui/dist.
      - run: bun install --frozen-lockfile && bun run build
        working-directory: ui
      - run: git diff --exit-code -- ui/dist

      # Deliberately no Swatinem/rust-cache here (ci.yml keeps it). A
      # restored cache is a target/ directory written by some earlier
      # workflow run, and a release binary must not be linked against
      # build outputs this run did not produce. A clean build costs a few
      # minutes per tag; a poisoned cache would ship in every artifact.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      - run: install -D target/${{ matrix.target }}/release/wifi-connect dist/wifi-connect-${{ matrix.arch }}

      - name: tarball
        run: |
          V="${GITHUB_REF_NAME#v}"
          S="wifi-connect-${V}-${{ matrix.target }}"
          mkdir -p "$S"
          install -m0755 dist/wifi-connect-${{ matrix.arch }} "$S/wifi-connect"
          cp packaging/systemd/wifi-connect.service "$S/"
          cp packaging/default/wifi-connect "$S/wifi-connect.env"
          cp LICENSE README.md "$S/"
          tar -czf "dist/${S}.tar.gz" "$S"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  image:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR (and the attestation, below)
      id-token: write # OIDC, to sign the attestation and the cosign signature
      attestations: write
      # With push-to-registry, the attest action also records where the
      # image is stored (the org's "Linked artifacts" page). Without this
      # it only warns, but the record is silently missing.
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/wifi-connect-*

      # No setup-qemu: nothing is emulated. The Dockerfile only COPYs
      # binaries that `cross` already built.
      #
      # BuildKit assembles the image, generates its provenance and SBOM, and is
      # handed the GHCR credentials to do it, so it is pinned like the
      # cross images: tag for humans, digest for Docker. (Left alone,
      # setup-buildx runs whatever moby/buildkit:buildx-stable-1 is today.)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/screenly-labs/wifi-connect
          # CalVer, so: 2026.10.0 (exact), 2026.10 (latest patch that
          # month), latest.
          #
          # No bare {{major}}: under CalVer that is `2026`, a tag whose
          # meaning drifts for a whole year and which reads like a semver
          # compatibility promise this project does not make. Pin the exact
          # version or track latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/screenly-labs/wifi-connect
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Keyless cosign signature, alongside (not instead of) the GitHub
      # attestation above: it is what `cosign verify`, admission
      # controllers and most of the ecosystem look for.
      #
      # Signed BY DIGEST, never by tag. A tag is a mutable pointer that
      # could be moved between push and sign; the digest is what
      # build-push-action actually pushed.
      #
      # --recursive signs the multi-arch index AND each manifest under it.
      # Docker resolves the index to a per-platform manifest on pull, and
      # anyone who pins `wifi-connect@sha256:<platform digest>` (what
      # `docker inspect` shows on a device) would otherwise have nothing
      # to verify against. It also signs buildx's provenance/SBOM
      # manifests in the index, which is harmless.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --recursive "ghcr.io/screenly-labs/wifi-connect@${DIGEST}"

      # Verify as a user would, so a signature that does not verify fails
      # the release instead of shipping. The identity is exact: this
      # workflow file, at this tag.
      - name: verify the image signatures
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/screenly-labs/wifi-connect"
          verify() {
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$1" > /dev/null
            echo "verified $1"
          }
          verify "${image}@${DIGEST}"
          # And every platform manifest, i.e. what --recursive is for.
          # (`unknown/unknown` entries are buildx attestation manifests.)
          platforms="$(docker buildx imagetools inspect --raw "${image}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')"
          [ -n "${platforms}" ] || { echo "::error::no platform manifests in ${DIGEST}"; exit 1; }
          for d in ${platforms}; do
            verify "${image}@${d}"
          done

      # A GHCR package is PRIVATE when it is first created, and nothing
      # in a workflow can change that -- visibility is an org setting
      # with no REST endpoint behind it. A pushed-but-private image is
      # the worst kind of release: every job here goes green, the tags
      # all exist, and every device that tries to pull gets a 401.
      #
      # So prove it the way a device would: take an anonymous pull token
      # and fetch the manifest for the tag just pushed. Retried, because
      # a freshly pushed tag can take a few seconds to be servable.
      - name: the pushed image is anonymously pullable
        run: |
          image="screenly-labs/wifi-connect"
          tag="${GITHUB_REF_NAME#v}"

          for attempt in 1 2 3 4 5; do
            token="$(curl -fsS \
              "https://ghcr.io/token?scope=repository:${image}:pull&service=ghcr.io" \
              | jq -r '.token // empty')" || token=""

            if [ -n "${token}" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H "Accept: application/vnd.oci.image.index.v1+json" \
                "https://ghcr.io/v2/${image}/manifests/${tag}")"
              if [ "${code}" = "200" ]; then
                echo "ghcr.io/${image}:${tag} is anonymously pullable"
                exit 0
              fi
              echo "manifest returned HTTP ${code} (attempt ${attempt})"
            else
              echo "no anonymous pull token (attempt ${attempt})"
            fi
            sleep 10
          done

          echo "::error::ghcr.io/${image}:${tag} cannot be pulled" \
               "anonymously, so no device can use this release. The" \
               "package is almost certainly still private: GitHub ->" \
               "Screenly-Labs -> Packages -> wifi-connect -> Package" \
               "settings -> Change visibility -> Public. There is no" \
               "API for this; it has to be done once, by hand, by an" \
               "org owner. Then re-run this job."
          exit 1

  snap:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64, armhf]
    runs-on: ubuntu-24.04
    # Publishing authenticates with the store secret, not GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/wifi-connect-*

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
        with:
          snapcraft-args: --build-for ${{ matrix.platform }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-${{ matrix.platform }}
          path: ${{ steps.snapcraft.outputs.snap }}

      # Publishing is gated on the secret existing, so a fork still
      # produces a downloadable .snap rather than failing the run.
      #
      # The gate is its own step. It used to be `if: env.SNAPCRAFT_...`
      # on the publish step, reading the `env:` of that same step — but a
      # step's `if` is evaluated before its own `env` is applied, so the
      # condition was always false and the publish was skipped on every
      # release whether the secret existed or not. Nothing ever reached
      # the store. A job-level env would also fix it, at the cost of
      # handing the store credentials to every action in the job.
      - name: are store credentials configured
        id: store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "${SNAPCRAFT_STORE_CREDENTIALS}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: publish to the snap store
        if: ${{ steps.store.outputs.configured == 'true' }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          # A tag is a release, and the GitHub Release it produces is not
          # marked pre-release, so the snap goes where `snap install`
          # looks by default.
          release: stable

      # Skipping is right for a fork and wrong here. Say so on the run
      # summary rather than skipping silently, which is how the missing
      # store listing went unnoticed.
      - name: say so when the store publish was skipped
        if: ${{ steps.store.outputs.configured != 'true' && github.repository == 'Screenly-Labs/wifi-connect' }}
        run: |
          echo "::warning::SNAPCRAFT_STORE_CREDENTIALS is not set, so the" \
               "${{ matrix.platform }} snap was NOT published to the Snap" \
               "Store. See docs/snap.md, 'Publishing'."

  release:
    needs: [image, snap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release, generate its notes
      id-token: write # OIDC, to sign the tarball attestation and cosign bundles
      attestations: write
    steps:
      # Only what this workflow means to ship. An unfiltered download also
      # picks up the build record build-push-action uploads as an artifact
      # (`*.dockerbuild`), which then went out as a release asset and into
      # SHA256SUMS.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snap-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # Keyless cosign signature for every file the release ships: raw
      # binaries, tarballs, snaps and SHA256SUMS. Each `<file>` gets a
      # `<file>.sigstore.json` bundle (certificate, signature and Rekor
      # inclusion proof in one), uploaded next to it by `dist/*` below.
      #
      # Runs after SHA256SUMS on purpose: the checksums cover what ships,
      # not the bundles, which verify themselves. Signing is done here and
      # not in `build`, which runs third-party code and must never hold
      # an OIDC token that can sign as this workflow.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - name: sign release files
        run: |
          shopt -s nullglob
          files=()
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue ;; esac
            files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::nothing to sign in dist/"
            exit 1
          fi
          for f in "${files[@]}"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f" > /dev/null
            echo "signed $f"
          done

      # Every bundle, not a sample: it is a few seconds, and any one
      # broken signature is a release asset nobody can verify.
      - name: verify release signatures
        run: |
          shopt -s nullglob
          n=0
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue ;; esac
            b="${f}.sigstore.json"
            cosign verify-blob \
              --bundle "$b" \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::nothing verified"; exit 1; }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
