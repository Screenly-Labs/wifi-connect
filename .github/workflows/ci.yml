name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ui:
    name: portal (bun + tailwind)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run format:check
      - run: bun run build

      # The gate that makes committing ui/dist safe.
      #
      # ui/dist is committed so that `cargo build` never needs bun — a
      # build.rs that shelled out to it would break cargo install, the
      # cross containers and snapcraft's build environment. The cost of
      # that choice is that the committed output can go stale, so CI
      # rebuilds it and fails on any difference.
      - name: ui/dist is in sync with ui/src
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::ui/dist is stale. Run 'cd ui && bun run build' and commit the result."
            exit 1
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      # Enforces the HTTP-only design: no TLS stack may enter the tree
      # beyond rustls for error reporting. See deny.toml for why.
      - run: cargo deny check bans advisories licenses sources

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - run: cargo test --all-features

  # This crate contains hand-written DHCP and DNS wire codecs. An alignment
  # or byte-order bug there is invisible on x86_64 and fatal on armv7, and
  # running the tests under qemu-user is the reason `cross` was chosen over
  # cargo-zigbuild.
  test-armv7:
    name: test (armv7 under qemu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross
      - run: cross test --target armv7-unknown-linux-musleabihf

  build:
    needs: [ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
            platform: linux/arm64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            platform: linux/arm/v7
          # ARMv6: Raspberry Pi 1 and Pi Zero. The bare `arm-` triple is
          # the ARMv6 baseline, not a typo for `armv7-`.
          - target: arm-unknown-linux-musleabihf
            arch: armv6
            platform: linux/arm/v6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      - run: install -D target/${{ matrix.target }}/release/wifi-connect dist/wifi-connect-${{ matrix.arch }}

      # Registers binfmt handlers so the runner can execute a foreign-arch
      # binary. Without this the smoke-run below dies with
      # "exec format error" — running an arm64 container on an amd64 host
      # still needs emulation; the --platform flag alone does not provide
      # it. (The release image build needs no QEMU, because it only COPYs
      # binaries that cross has already produced.)
      - if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Upstream shipped an empty ARMv6 container for three years because
      # nothing ever executed the artifact. Prove each one runs.
      - name: the binary executes on its target architecture
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            ./dist/wifi-connect-amd64 --version
          else
            docker run --rm --platform ${{ matrix.platform }} \
              -v "$PWD/dist:/d" --entrypoint /d/wifi-connect-${{ matrix.arch }} \
              docker.io/library/alpine:3.21 --version
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: dist/wifi-connect-${{ matrix.arch }}
          retention-days: 7

  # The snap is packaging rather than code, so nothing else in this file
  # would notice it breaking — and it did break: the first build of it
  # for v2026.10.0 ran *after* the tag was pushed, failed on a version
  # the build instance could not compute, and took the whole release
  # with it (the release job needs the snaps, so no tarballs and no
  # checksums were published either).
  #
  # Same principle as "the binary executes on its target architecture"
  # above: build the artifact, then check the thing about it that
  # silently went wrong.
  snap:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the release workflow. All three are built because the
        # one mapping that is easy to get wrong — snapcraft's `armhf`
        # onto this project's `armv7` binary — is only exercised by the
        # armhf build.
        platform: [amd64, arm64, armhf]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/wifi-connect-*

      # The configure hook and the launcher are POSIX sh run by snapd on
      # the device, where a syntax slip means `snap set` fails for every
      # key or the daemon never starts.
      - name: shellcheck the snap's hook and launcher
        run: shellcheck snap/hooks/configure snap/local/launch

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
        with:
          snapcraft-args: --build-for ${{ matrix.platform }}

      # snapcraft names the file wifi-connect_<version>_<arch>.snap, so
      # the filename is precisely where an empty or wrong version shows
      # up — which is the failure this job exists to catch. A build that
      # merely succeeded would not have.
      - name: the snap carries the Cargo.toml version
        run: |
          want="$(sh packaging/version.sh)"
          got="$(basename "${{ steps.snapcraft.outputs.snap }}")"
          case "${got}" in
            "wifi-connect_${want}_"*.snap)
              echo "${got} carries version ${want}" ;;
            *)
              echo "::error::${got} does not carry the Cargo.toml version ${want}"
              exit 1 ;;
          esac
